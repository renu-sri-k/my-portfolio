<!DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        h1 {
            margin-top: 20px;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: white;
            margin: 10px auto;
            padding: 10px;
            width: 250px;
            display: flex;
            justify-content: space-between;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>My To-Do App 🚀</h1>

<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") return;

    let li = document.createElement("li");
    li.innerHTML = task + 
        " <button onclick='this.parentElement.remove()'>X</button>";

    document.getElementById("taskList").appendChild(li);

    input.value = "";
}
    
let input = document.getElementById("taskInput");

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        addTask();
    }
});
    
</script>

</body>
</html>
